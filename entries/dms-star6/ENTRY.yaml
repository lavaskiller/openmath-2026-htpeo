id: dms-star6
title: "Partial progress on the Dvorak-Mohar-Samal conjecture (star chromatic index of subcubic graphs <= 6), Lean 4.33.1"
target:
  problem: "Open Problem Garden: Star chromatic index of cubic graphs (is chi'_s(G) <= 6 for every subcubic G?)"
  problem_ids:
    - "OPG-37271"
    - "TODO: canonical OPDP family id and source snapshot id (from the organisers; PACKET.md section 1)"
  status_before_event: "open; best published bound 7 (Dvorak-Mohar-Samal, J. Graph Theory 72(3) 2013, arXiv:1011.3376)"
mode: "M3A (proposed, pending admission)"
requested_band: "P3 lower end, p = 0.15; fallback P2, p = 0.10 (PACKET.md section 1.6)"
claims:                          # PACKET.md sections 1.2-1.4; the conjecture RH2F.DMS itself is NOT proved
  - lean_name: "FlowerSnark.flower_family"
    plain_words: "T1: flower snarks J_n, odd n >= 5, are star 5-edge-colourable"
    file: "artifact/lean/pack4/src/"
  - lean_name: "GoldbergSnark.goldberg_family"
    plain_words: "T1: Goldberg snarks G_k, odd k >= 5, star 5-edge-colourable"
    file: "artifact/lean/pack4/src/"
  - lean_name: "GPetersen2.gp2_star, GPetersen2.gp2_spokes"
    plain_words: "T1: GP(k,2), k >= 5, star 6-edge-colourable with the spokes as one colour class"
    file: "artifact/lean/pack4/src/"
  - lean_name: "gp_family (and gp_star5, GP2Five.star5, GP3Five.star5, GPk.family4 ...)"
    plain_words: "T1: generalized Petersen graphs GP(n,k), 1 <= k <= 15, n >= 2k+1, except GP(3,1), star 5-edge-colourable"
    file: "artifact/lean/pack4/src/"
  - lean_name: "Inflation.inflate_star5"
    plain_words: "T1: Petersen-type vertex inflation of any loopless multigraph with injective ports is star 5-edge-colourable"
    file: "artifact/lean/pack4/src/"
  - lean_name: "Mobius.mobius_family"
    plain_words: "T1: Moebius ladders M_n, n >= 4, star 5-edge-colourable"
    file: "artifact/lean/pack4/src/"
  - lean_name: "Star6.star6_cubic_bridgeless_le14, Star6.matching_colour_class_10_14, Star6.star6_leaf_le14, Star6.star6_subcubic_le7, Star6.bounded_reduction"
    plain_words: "T2: DMS for bridgeless cubic loopless multigraphs on <= 14 vertices and their leaf graphs; for all loopless subcubic multigraphs on <= 7 vertices"
    file: "artifact/lean/pack5/src/Star6Corollaries.lean"
  - lean_name: "Star6.dms_iff_cubic16, Star6.dms_of_hyp16_iid16, Star6.counterexample_cubic16, Star6.counterexample_reduced16, Star6.smallest_not_ex1, Star6.minimal_counterexample"
    plain_words: "T2: DMS is equivalent to star 6-colourability of connected bridgeless cubic loopless multigraphs on >= 16 vertices and of their leaf graphs; shape of a counterexample"
    file: "artifact/lean/pack5/src/Star6Equiv.lean"
  - lean_name: "Star6.simple_star6_cubic_bridgeless_le14, Star6.simple_star6_subcubic_le7"
    plain_words: "T2: the small-order theorems for Mathlib SimpleGraph"
    file: "artifact/lean/pack5/src/Star6Simple.lean"
  - lean_name: "RH2F.layer37 (star6_dms_conditional_A, star6_dms_conditional_B, RH2F.rh2_final)"
    plain_words: "T3: DMS follows from named open hypotheses (FEEXTD10, FEEXISTD18, POLE, TDTRI, FEEXTTNE16, FEEXIST0NE16 / WEXT, TDLTRI, IID16); none of the hypotheses is proved"
    file: "artifact/lean/pack3/src/"
  - lean_name: "RH2F.base12, RH2F.simple14, RH2F.b14d, RH2F.feexist16, RH2F.cls16c, RH2Fid.fidelity_bundle, RH2P.layerP"
    plain_words: "T4: finite certificates (10-14 vertices EX1-good, 16-vertex far-exchange existence, 607 c4c graphs on 16 vertices), statement-fidelity bundle, Schoenberger for multigraphs"
    file: "artifact/lean/pack3/src/"
  - lean_name: "MGraph.dms_of_hole, P05Lean.cubicSharp5_dms, DmsIIsLean.cs5s_dms, P06Lean.cover_main"
    plain_words: "Lean-core file: HOLE => DMS, CubicSharp5 => DMS, cover pull-back (known argument, not claimed as an advance)"
    file: "artifact/lean/pack2/lean433/StarDMS2.lean"
