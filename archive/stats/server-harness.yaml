notes: "Why two sources: 60 runs have no result record (killed or timed out), and falsifier and reviewer runs have no stream-json run log, so source B is incomplete (53.7M output tokens against 67.1M in the transcripts). The transcripts have a final usage record for all but 1 of 32267 messages. cost_usd is therefore a lower bound: it covers the 1103 runs with a result record only. The star6 run started on the laptop (WSL) on 2026-09-27/28 before it moved to the server; Claude sessions of that first part are not on the server and are NOT included here (not collected; whether they still exist in the laptop WSL home was not checked). GPT usage of the harness is in server-codex.yaml."
