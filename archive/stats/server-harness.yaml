how_to_collect:
  - "the script is scripts/mh-export-usage.sh in the harness repository: usage 'scripts/mh-export-usage.sh star6 [out.tar.gz] [--since YYYY-MM-DD]'"
  - "as read in the laptop copy of the script (2026-10-03): it copies the whole project (workers, overnight, reviewer, fact_graph, verify runs, codex sessions, Claude transcripts) to a temporary staging directory, builds INDEX.json there and then makes the tarball; INDEX.json cannot be produced without the staging copy unless the embedded Python part is run directly on the live directories"
  - "run it as a job, output under ~/team-stats/: cd ~/m_harness/harness && ~/.venvs/mh/bin/python -m danus.ops.jobs star6 teamstats 2G -- bash scripts/mh-export-usage.sh star6 ~/team-stats/ai-usage-star6.tar.gz"
  - "keep the tarball on the server; record only: sha256sum ~/team-stats/ai-usage-star6.tar.gz"
  - "extract the index only: tar -xzf ~/team-stats/ai-usage-star6.tar.gz -C ~/team-stats ./INDEX.json"
  - "sum INDEX.json runs per (role, model): number of runs, output_tokens, cost_usd; record the date range of the logs"
  - "limit of the script as written: an INDEX.json row has role, model, cost_usd, output_tokens, turns - it does NOT carry input or cache tokens. For input/cache tokens run tools/sum_claude_usage.py on the claude-sessions/ part (the server-side Claude Code project folders of the star6 project)"
  - "the staging copy needs free disk space of about the project size and /tmp is used by mktemp: check df first"
